<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="55%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="triStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.95)"/>
      <stop offset="100%" stop-color="rgba(147,197,253,0.6)"/>
    </linearGradient>
    <radialGradient id="centerGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </radialGradient>
    <radialGradient id="nodeGrad" cx="30%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>

  <!-- Subtle background network -->
  <g opacity="0.12" stroke="#93C5FD" stroke-width="0.8">
    <line x1="15" y1="28" x2="55" y2="50"/>
    <line x1="185" y1="22" x2="148" y2="48"/>
    <line x1="12" y1="170" x2="42" y2="148"/>
    <line x1="188" y1="175" x2="158" y2="148"/>
    <circle cx="15" cy="28" r="2" fill="#93C5FD" stroke="none"/>
    <circle cx="185" cy="22" r="2" fill="#93C5FD" stroke="none"/>
    <circle cx="12" cy="170" r="2" fill="#93C5FD" stroke="none"/>
    <circle cx="188" cy="175" r="2" fill="#93C5FD" stroke="none"/>
    <circle cx="185" cy="155" r="1.2" fill="#93C5FD" stroke="none"/>
  </g>

  <!-- Rounded equilateral triangle frame -->
  <!-- Vertices: T=(100,32) BR=(162,139) BL=(38,139), corner radius=28 -->
  <path
    d="M 114,56 L 134,139 Q 162,139 148,115 L 52,115 Q 38,139 66,139 L 86,56 Q 100,32 114,56 Z"
    fill="rgba(255,255,255,0.07)"
    stroke="url(#triStroke)"
    stroke-width="6"
    filter="url(#softGlow)"
  />

  <!-- Spokes from center to triangle corner nodes -->
  <g stroke="rgba(255,255,255,0.38)" stroke-width="1.8">
    <line x1="100" y1="97" x2="100" y2="43"/>
    <line x1="100" y1="97" x2="149" y2="122"/>
    <line x1="100" y1="97" x2="51" y2="122"/>
  </g>

  <!-- Three orbital ellipses (atom model), center=(100,97), rx=44, ry=17 -->
  <g fill="none" stroke="rgba(255,255,255,0.62)" stroke-width="2.2" filter="url(#glow)">
    <ellipse cx="100" cy="97" rx="44" ry="17"/>
    <ellipse cx="100" cy="97" rx="44" ry="17" transform="rotate(60,100,97)"/>
    <ellipse cx="100" cy="97" rx="44" ry="17" transform="rotate(-60,100,97)"/>
  </g>

  <!-- Electron nodes at major-axis ends of each orbit -->
  <g filter="url(#glow)">
    <circle cx="144" cy="97"  r="5" fill="url(#nodeGrad)"/>
    <circle cx="56"  cy="97"  r="5" fill="url(#nodeGrad)"/>
    <circle cx="122" cy="135" r="5" fill="url(#nodeGrad)"/>
    <circle cx="78"  cy="59"  r="5" fill="url(#nodeGrad)"/>
    <circle cx="122" cy="59"  r="5" fill="url(#nodeGrad)"/>
    <circle cx="78"  cy="135" r="5" fill="url(#nodeGrad)"/>
  </g>

  <!-- Triangle corner nodes -->
  <g filter="url(#glow)">
    <circle cx="100" cy="41"  r="7.5" fill="url(#nodeGrad)"/>
    <circle cx="150" cy="123" r="7.5" fill="url(#nodeGrad)"/>
    <circle cx="50"  cy="123" r="7.5" fill="url(#nodeGrad)"/>
  </g>

  <!-- Central sphere with specular highlight -->
  <circle cx="100" cy="97" r="14" fill="url(#centerGrad)" filter="url(#softGlow)"/>
  <circle cx="95.5" cy="92.5" r="4.5" fill="rgba(255,255,255,0.95)"/>
</svg>
