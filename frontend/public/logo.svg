<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b57f0"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f6ef7"/>
    </linearGradient>
  </defs>

  <!-- Fundo circular com gradiente -->
  <circle cx="100" cy="100" r="90" fill="url(#g1)"/>

  <!-- Nó central -->
  <circle cx="100" cy="100" r="14" fill="white" opacity="0.95"/>

  <!-- Nós satélite -->
  <circle cx="100" cy="42"  r="9" fill="white" opacity="0.85"/>
  <circle cx="100" cy="158" r="9" fill="white" opacity="0.85"/>
  <circle cx="42"  cy="100" r="9" fill="white" opacity="0.85"/>
  <circle cx="158" cy="100" r="9" fill="white" opacity="0.85"/>
  <circle cx="56"  cy="56"  r="7" fill="white" opacity="0.70"/>
  <circle cx="144" cy="56"  r="7" fill="white" opacity="0.70"/>
  <circle cx="56"  cy="144" r="7" fill="white" opacity="0.70"/>
  <circle cx="144" cy="144" r="7" fill="white" opacity="0.70"/>

  <!-- Ligações axiais -->
  <line x1="100" y1="86"  x2="100" y2="51"  stroke="white" stroke-width="2.5" opacity="0.6"/>
  <line x1="100" y1="114" x2="100" y2="149" stroke="white" stroke-width="2.5" opacity="0.6"/>
  <line x1="86"  y1="100" x2="51"  y2="100" stroke="white" stroke-width="2.5" opacity="0.6"/>
  <line x1="114" y1="100" x2="149" y2="100" stroke="white" stroke-width="2.5" opacity="0.6"/>

  <!-- Ligações diagonais -->
  <line x1="110" y1="90"  x2="138" y2="62"  stroke="white" stroke-width="1.8" opacity="0.45"/>
  <line x1="90"  y1="90"  x2="62"  y2="62"  stroke="white" stroke-width="1.8" opacity="0.45"/>
  <line x1="110" y1="110" x2="138" y2="138" stroke="white" stroke-width="1.8" opacity="0.45"/>
  <line x1="90"  y1="110" x2="62"  y2="138" stroke="white" stroke-width="1.8" opacity="0.45"/>

