<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="fTri" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.97)"/>
      <stop offset="100%" stop-color="rgba(147,197,253,0.7)"/>
    </linearGradient>
    <radialGradient id="fCenter" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </radialGradient>
    <radialGradient id="fNode" cx="30%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </radialGradient>
    <filter id="fg" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#fbg)"/>

  <!-- Rounded equilateral triangle -->
  <!-- Vertices: T=(32,10) BR=(56,52) BL=(8,52), corner radius=10 -->
  <path
    d="M 37.5,19.5 L 45,52 Q 56,52 50.5,42.5 L 13.5,42.5 Q 8,52 19,52 L 26.5,19.5 Q 32,10 37.5,19.5 Z"
    fill="rgba(255,255,255,0.08)"
    stroke="url(#fTri)"
    stroke-width="2.5"
    filter="url(#fg)"
  />

  <!-- Three orbital ellipses, center=(32,36), rx=16, ry=6 -->
  <g fill="none" stroke="rgba(255,255,255,0.68)" stroke-width="1.3" filter="url(#fg)">
    <ellipse cx="32" cy="36" rx="16" ry="6"/>
    <ellipse cx="32" cy="36" rx="16" ry="6" transform="rotate(60,32,36)"/>
    <ellipse cx="32" cy="36" rx="16" ry="6" transform="rotate(-60,32,36)"/>
  </g>

  <!-- Triangle corner nodes -->
  <circle cx="32" cy="14"  r="3"   fill="url(#fNode)" filter="url(#fg)"/>
  <circle cx="51" cy="46"  r="3"   fill="url(#fNode)" filter="url(#fg)"/>
  <circle cx="13" cy="46"  r="3"   fill="url(#fNode)" filter="url(#fg)"/>

  <!-- Central sphere + highlight -->
  <circle cx="32" cy="36" r="5.5" fill="url(#fCenter)" filter="url(#fg)"/>
  <circle cx="30" cy="34" r="2"   fill="rgba(255,255,255,0.95)"/>
</svg>
